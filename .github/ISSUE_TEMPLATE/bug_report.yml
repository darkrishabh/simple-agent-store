name: Bug report
description: Report reproducible incorrect SimpleAgentStore behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private object data. Report vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SimpleAgentStore version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 22, HTTP MCP
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide redacted commands, inputs, and the smallest database setup needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, private values, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
